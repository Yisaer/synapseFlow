domain: sink
interactions:
  - id: sink.memory_delta_omit_if_empty
    title: Memory delta omit-if-empty output
    summary: Validate memory sink emission together with omit-if-empty suppression for unchanged delta collection output.
    features:
      - sink.connector.memory_output
      - sink.output.omit_if_empty
    status: active

  - id: sink.encoder_gzip_file_delivery
    title: Encoder + gzip compress + file connector delivery
    summary: Validate that encoder output passes through gzip compression and is correctly written by the file connector.
    features:
      - sink.compress.gzip_delivery
      - sink.connector.file_output
    status: active

  - id: sink.encoder_zstd_file_delivery
    title: Encoder + zstd compress + file connector delivery
    summary: Validate that encoder output passes through zstd compression and is correctly written by the file connector.
    features:
      - sink.compress.zstd_delivery
      - sink.connector.file_output
    status: active

  - id: sink.encoder_aes_file_delivery
    title: Encoder + AES encrypt + file connector delivery
    summary: Validate that encoder output passes through AES encryption and is correctly written by the file connector.
    features:
      - sink.encrypt.aes_gcm_delivery
      - sink.connector.file_output
    status: active

  - id: sink.encoder_gzip_aes_file_delivery
    title: Encoder + gzip compress + AES encrypt + file connector delivery
    summary: Validate that compressed encoder output passes through AES encryption and is correctly written by the file connector.
    features:
      - sink.compress.gzip_delivery
      - sink.encrypt.aes_gcm_delivery
      - sink.connector.file_output
    status: active
