[package]
name = "flow"
version = "0.0.1"
edition = "2021"

[dependencies]
datatypes = { path = "../datatypes" }
parser = { path = "../parser" }
build_info = { path = "../build_info" }
veloflux_metrics = { path = "../metrics" }
serde_json = "1.0"
serde = { version = "1", features = ["derive"] }
sqlparser = { version = "0.40", features = ["serde", "visitor"] }
tokio = { version = "1", default-features = false, features = ["macros", "rt-multi-thread", "sync", "time"] }
tokio-stream = { version = "0.1", default-features = false, features = ["sync"] }
async-trait = "0.1"
futures = "0.3"
bytes = "1"
thiserror = "1.0"
once_cell = "1.19"
parking_lot = "0.12"
rumqttc = { version = "0.25.1", default-features = false, features = ["use-rustls-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
url = "2"
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider", "json"] }
uuid = { version = "1", features = ["v4"] }
tracing = "0.1"
parquet = "53.0.0"
arrow = "53.0.0"
kuksa-rust-sdk = "0.2.2"
http = "1"
tonic = { version = "0.14", default-features = false, features = ["transport", "channel", "codegen"] }
tonic-prost = "0.14"
prost = "0.14"
prost-types = "0.14"
humantime-serde = "1"
libc = "0.2"
rand = "0.10.0"
regex = "1.12.3"
icu = { version = "2.1.1", features = ["compiled_data"] }
upon = "0.10"
base64 = "0.22"
crc32fast = "1"
flate2 = "1.0"
zstd = "0.13"
aes = "0.8"
aes-gcm = { version = "0.10", features = ["aes", "zeroize"] }
aead = { version = "0.5", features = ["alloc", "stream"] }
hkdf = "0.12"
hex = "0.4"
zeroize = "1"
getrandom = "0.3"
md5 = "0.7"
sha1 = "0.10"
sha2 = "0.10"
chrono = "0.4"
anng = { version = "0.1.3", optional = true }
gstreamer = { version = "0.23", optional = true }
gstreamer-app = { version = "0.23", optional = true }

[build-dependencies]
tonic-prost-build = "0.14"
prost-build = "0.14"

[dev-dependencies]
rumqttd = "0.20.0"
tempfile = "3"
tokio = { version = "1", default-features = false, features = ["macros", "rt", "sync", "time", "test-util"] }

[features]
deadlock_detection = ["parking_lot/deadlock_detection"]
video_gstreamer = ["gstreamer", "gstreamer-app"]
nng_pubsub = ["anng"]
