name: QNX 7 Direct SDP Debug Build

on:
  pull_request:
    types: [opened, reopened, synchronize]
  workflow_dispatch:
    inputs:
      qnx_target:
        description: QNX Rust target to build
        required: true
        default: aarch64-unknown-nto-qnx710
        type: choice
        options:
          - aarch64-unknown-nto-qnx710
          - x86_64-pc-nto-qnx710
      qnx_baseline:
        description: QNX SDP baseline package
        required: true
        default: com.qnx.qnx710
        type: string
      qnx_mirror_baseline:
        description: QNX SDP mirror baseline id
        required: true
        default: qnx710
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.run_id }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_BUILD_JOBS: 2
  CARGO_HOME: /home/runner/.cargo
  CARGO_INCREMENTAL: 0
  QNX_INSTALL_DIR: /home/runner/qnx710
  QNX_QSC_DIR: /home/runner/qnxsoftwarecenter
  QNX_RUST_TOOLCHAIN: qnx7

jobs:
  qnx7-debug-build-direct:
    name: QNX 7 direct debug build (${{ inputs.qnx_target || 'aarch64-unknown-nto-qnx710' }})
    runs-on: infra-emqx-io-4c
    timeout-minutes: 120
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install host dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            ca-certificates \
            curl \
            file \
            m4 \
            protobuf-compiler \
            unzip

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: qnx7-direct-cargo-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            qnx7-direct-cargo-${{ runner.os }}-

      - name: Install QNX Software Center
        env:
          GH_TOKEN: ${{ secrets.QNX_INSTALLER_TOKEN }}
        run: |
          set -euo pipefail

          installer="$RUNNER_TEMP/qnx-setup-linux.run"
          gh release download qnx-sdp-8-installer \
            --repo Yisaer/qnx-private-assets \
            --pattern qnx-setup-2.0.4-202501021438-linux.run \
            --dir "$RUNNER_TEMP"
          mv "$RUNNER_TEMP/qnx-setup-2.0.4-202501021438-linux.run" "$installer"
          echo "5695a0ec8a1fd91840753b2cba86a9325f6052d4f69c757166cc61b09bcbe507  $installer" | sha256sum --check
          if file "$installer" | grep -qiE 'html|text'; then
            echo "Downloaded QNX Software Center installer does not look executable." >&2
            echo "Check the qnx-private-assets release asset." >&2
            file "$installer" >&2
            exit 1
          fi
          chmod +x "$installer"

          "$installer" force-override disable-auto-start agree-to-license-terms "$QNX_QSC_DIR"

          qsc_bin="$QNX_QSC_DIR/qnxsoftwarecenter/qnxsoftwarecenter_clt"
          if [ ! -x "$qsc_bin" ]; then
            qsc_bin="$(find "$QNX_QSC_DIR" -type f -name qnxsoftwarecenter_clt -perm -111 | head -n 1)"
          fi
          if [ -z "$qsc_bin" ] || [ ! -x "$qsc_bin" ]; then
            echo "qnxsoftwarecenter_clt was not found under $QNX_QSC_DIR" >&2
            find "$QNX_QSC_DIR" -maxdepth 4 -type f | sort >&2
            exit 1
          fi

          qsc_dir="$(dirname "$qsc_bin")"
          echo "$qsc_dir" >> "$GITHUB_PATH"
          echo "QNX_QSC_BIN=$qsc_bin" >> "$GITHUB_ENV"

      - name: Install QNX 7 SDP
        env:
          QNX_LICENSE_KEY: ${{ secrets.QNX_LICENSE_KEY }}
          QNX_BASELINE: ${{ inputs.qnx_baseline || 'com.qnx.qnx710' }}
          QNX_MIRROR_BASELINE: ${{ inputs.qnx_mirror_baseline || 'qnx710' }}
          QNX_MYQNX_USER: ${{ secrets.QNX_MYQNX_USER }}
          QNX_MYQNX_PASSWORD: ${{ secrets.QNX_MYQNX_PASSWORD }}
        run: |
          set -euo pipefail

          "$QNX_QSC_BIN" \
            -addLicenseKey "$QNX_LICENSE_KEY" \
            -listLicenseKeys

          if [ -z "$QNX_MYQNX_USER" ] || [ -z "$QNX_MYQNX_PASSWORD" ]; then
            echo "QNX_MYQNX_USER and QNX_MYQNX_PASSWORD secrets are required to mirror QNX SDP packages." >&2
            exit 1
          fi

          "$QNX_QSC_BIN" \
            -setDebugSymbolsEnabled=false \
            -mirrorBaseline "$QNX_MIRROR_BASELINE" \
            -myqnx.user "$QNX_MYQNX_USER" \
            -myqnx.password "$QNX_MYQNX_PASSWORD"

          for attempt in 1 2 3; do
            "$QNX_QSC_BIN" \
              -setDebugSymbolsEnabled=false \
              -cleanInstall \
              -destination "$QNX_INSTALL_DIR" \
              -installBaseline "$QNX_BASELINE" \
              -listLicenseKeys \
              -myqnx.user "$QNX_MYQNX_USER" \
              -myqnx.password "$QNX_MYQNX_PASSWORD" && break
            if [ "$attempt" = 3 ]; then
              exit 1
            fi
            sleep $((attempt * 30))
          done

      - name: Locate QNX environment
        run: |
          set -euo pipefail

          env_script="$(find "$QNX_INSTALL_DIR" -type f -name qnxsdp-env.sh | head -n 1)"
          if [ -z "$env_script" ]; then
            echo "qnxsdp-env.sh was not found under $QNX_INSTALL_DIR" >&2
            find "$QNX_INSTALL_DIR" -maxdepth 4 -type f | sort >&2
            exit 1
          fi

          echo "QNX_ENV_SCRIPT=$env_script" >> "$GITHUB_ENV"

      - name: Install QNX 7 Rust toolchain
        env:
          QNX_RUST_TC_URL: https://github.com/qorix-group/rust-lang-qnx8/releases/download/1.3.0/qnx7_rust_toolchain.tar.gz
          QNX_RUST_TC_DIR: /home/runner/qnx7-rust-toolchain
        run: |
          set -euo pipefail

          echo "Downloading QNX 7 Rust toolchain from qorix-group/rust-lang-qnx8..."
          curl -fsSL "$QNX_RUST_TC_URL" -o /tmp/qnx7_rust_toolchain.tar.gz
          mkdir -p "$QNX_RUST_TC_DIR"
          tar -xzf /tmp/qnx7_rust_toolchain.tar.gz -C "$QNX_RUST_TC_DIR" --strip-components=1
          rm -f /tmp/qnx7_rust_toolchain.tar.gz

          if [ ! -x "$QNX_RUST_TC_DIR/bin/rustc" ]; then
            inner="$(find "$QNX_RUST_TC_DIR" -maxdepth 3 -type f -name rustc -perm -111 | head -1)"
            if [ -n "$inner" ]; then
              QNX_RUST_TC_DIR="$(dirname "$(dirname "$inner")")"
              echo "Adjusted toolchain root to: $QNX_RUST_TC_DIR"
            else
              echo "QNX 7 Rust toolchain: rustc not found after extraction" >&2
              find "$QNX_RUST_TC_DIR" -maxdepth 4 -type f | sort >&2
              exit 1
            fi
          fi

          rustup toolchain link "$QNX_RUST_TOOLCHAIN" "$QNX_RUST_TC_DIR"
          cargo +"$QNX_RUST_TOOLCHAIN" -V
          rustc +"$QNX_RUST_TOOLCHAIN" -Vv

          echo "=== QNX 7 Rust toolchain diagnostics ==="
          sysroot="$(rustc +"$QNX_RUST_TOOLCHAIN" --print sysroot)"
          echo "Sysroot: $sysroot"
          echo "Installed targets with pre-built std:"
          ls -1 "$sysroot/lib/rustlib/" 2>/dev/null || true
          echo "Known QNX targets:"
          rustc +"$QNX_RUST_TOOLCHAIN" --print target-list 2>/dev/null | grep -i qnx || true

      - name: Build veloFlux debug binary for QNX 7
        env:
          RUST_TARGET: ${{ inputs.qnx_target || 'aarch64-unknown-nto-qnx710' }}
          CARGO_BUILD_TARGET: ${{ inputs.qnx_target || 'aarch64-unknown-nto-qnx710' }}
        run: |
          set -euo pipefail
          # shellcheck disable=SC1090
          source "$QNX_ENV_SCRIPT"

          echo "QNX TCP keepalive macros:"
          grep -RnsE "#[[:space:]]*define[[:space:]]+TCP_KEEP(ALIVE|IDLE|INTVL|CNT)\\b" \
            "$QNX_TARGET/usr/include" | head -20 || true

          echo "Target cfg:"
          rustc +"$QNX_RUST_TOOLCHAIN" --print cfg --target "$RUST_TARGET" | sort

          make debug CARGO="cargo +$QNX_RUST_TOOLCHAIN"

      - name: Inspect QNX 7 binary
        env:
          QNX_TARGET: ${{ inputs.qnx_target || 'aarch64-unknown-nto-qnx710' }}
        run: |
          set -euo pipefail

          bin="target/$QNX_TARGET/debug/veloflux"
          test -x "$bin"
          file "$bin"

      - name: Upload QNX 7 debug binary
        uses: actions/upload-artifact@v4
        with:
          name: veloflux-qnx7-${{ inputs.qnx_target || 'aarch64-unknown-nto-qnx710' }}-debug
          path: target/${{ inputs.qnx_target || 'aarch64-unknown-nto-qnx710' }}/debug/veloflux
          if-no-files-found: error
