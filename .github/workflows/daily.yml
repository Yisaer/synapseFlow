name: Daily (SQL Assert + Perf + Sanitizers)

on:
  schedule:
    # 07:00 (UTC+8) == 23:00 UTC (previous day)
    - cron: "0 23 * * *"
  workflow_dispatch:
    inputs:
      task:
        description: "Which daily task to run"
        type: choice
        options:
          - all
          - sql-assert
          - perf-daily
          - sanitizers
        default: all

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_HOME: ${{ github.workspace }}/.cargo
  RUSTUP_HOME: ${{ github.workspace }}/.rustup

jobs:
  daily:
    name: Daily
    runs-on: ubuntu-latest
    if: >
      github.event_name == 'schedule' ||
      github.event.inputs.task == 'all' ||
      github.event.inputs.task == 'sql-assert' ||
      github.event.inputs.task == 'perf-daily'
    env:
      # schedule: always run "all"; workflow_dispatch: run selected task.
      DAILY_TASK: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.task || 'all' }}
    services:
      emqx:
        image: emqx/emqx:5.6.1
        ports:
          - 1883:1883
        env:
          EMQX_ALLOW_ANONYMOUS: "true"
          EMQX_LISTENER__TCP__DEFAULT__BIND: "0.0.0.0:1883"
    steps:
      - name: Maximize build space
        uses: easimon/maximize-build-space@v10
        with:
          root-reserve-mb: 4096
          swap-size-mb: 8192
          temp-reserve-mb: 1024
          remove-dotnet: 'true'
          remove-android: 'true'
          remove-haskell: 'true'
          remove-codeql: 'true'
          remove-docker-images: 'true'

      - uses: actions/checkout@v4

      - name: Setup Go
        if: ${{ env.DAILY_TASK == 'all' || env.DAILY_TASK == 'sql-assert' }}
        uses: actions/setup-go@v5
        with:
          go-version-file: tests/sql_assert/sql_gen/go.mod
          cache: false

      - name: Cache Go build
        if: ${{ env.DAILY_TASK == 'all' || env.DAILY_TASK == 'sql-assert' }}
        uses: actions/cache@v4
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: ${{ runner.os }}-go-${{ hashFiles('tests/sql_assert/sql_gen/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-

      - name: Generate SQL
        if: ${{ env.DAILY_TASK == 'all' || env.DAILY_TASK == 'sql-assert' }}
        working-directory: tests/sql_assert/sql_gen
        run: go run . --config ../config-test.toml

      - name: Install system dependencies
        run: sudo apt-get update -qq && sudo apt-get install -y -qq protobuf-compiler

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      # Build once, then reuse the release binaries for both daily tasks.
      - name: Build (release)
        if: ${{ env.DAILY_TASK == 'all' || env.DAILY_TASK == 'sql-assert' || env.DAILY_TASK == 'perf-daily' }}
        run: make release

      - name: Run Flow SQL Assert (release binary)
        if: ${{ env.DAILY_TASK == 'all' || env.DAILY_TASK == 'sql-assert' }}
        run: target/release/flow_sql_assert --config tests/sql_assert/config-test.toml

      - name: Upload SQL assert debug artifacts (on failure)
        if: ${{ failure() && (env.DAILY_TASK == 'all' || env.DAILY_TASK == 'sql-assert') }}
        uses: actions/upload-artifact@v4
        with:
          name: daily-sql-assert-artifacts-${{ github.run_id }}
          if-no-files-found: ignore
          path: |
            tests/sql_assert/config-test.toml
            tests/sql_assert/sqls.txt

      - name: Start veloflux
        if: ${{ env.DAILY_TASK == 'all' || env.DAILY_TASK == 'perf-daily' }}
        env:
          # Use the default jemalloc (enabled by default features) with perf-oriented runtime tuning.
          _RJEM_MALLOC_CONF: "background_thread:true,dirty_decay_ms:0,muzzy_decay_ms:0"
        run: |
          set -euo pipefail
          mkdir -p tmp/perf_daily_ci
          target/release/veloflux --config etc/config.example.yaml --data-dir tmp/perf_daily_ci/data > tmp/perf_daily_ci/veloflux.log 2>&1 &
          echo $! > tmp/perf_daily_ci/veloflux.pid

      - name: Run perf scenario (explicit columns)
        if: ${{ env.DAILY_TASK == 'all' || env.DAILY_TASK == 'perf-daily' }}
        env:
          PERF_OUT_DIR: tmp/perf_daily_ci/out_explicit
          PERF_DURATION_SECS: "120"
        run: |
          set -euo pipefail
          PYTHONPYCACHEPREFIX=tmp/pycache \
          python3 tests/perf_daily/perf_daily.py \
            --force \
            --base-url http://127.0.0.1:8080 \
            --metrics-url http://127.0.0.1:8080/metrics \
            --broker-url tcp://127.0.0.1:1883 \
            --topic /perf/daily \
            --qos 1 \
            --columns 15000 \
            --sql-mode explicit \
            --pipeline-id perf_daily_pipeline_explicit \
            --cases 20 \
            --str-len 10 \
            --duration-secs "${PERF_DURATION_SECS}" \
            --rate 50 \
            --scrape-interval-ms 15000 \
            --out-dir "${PERF_OUT_DIR}" \
            run

      - name: Render perf report (explicit columns)
        if: ${{ env.DAILY_TASK == 'all' || env.DAILY_TASK == 'perf-daily' }}
        env:
          PERF_OUT_DIR: tmp/perf_daily_ci/out_explicit
        run: |
          set -euo pipefail
          PYTHONPYCACHEPREFIX=tmp/pycache \
          python3 tests/perf_daily/perf_daily_report.py \
            --result-json "${PERF_OUT_DIR}/result.json" \
            --out-html "${PERF_OUT_DIR}/report.html" \
            --summary-path "${GITHUB_STEP_SUMMARY}" \
            --title "Perf Daily Wide MQTT - explicit (2m) (${{ github.sha }})"

      - name: Stop veloflux (after explicit)
        if: ${{ always() && (env.DAILY_TASK == 'all' || env.DAILY_TASK == 'perf-daily') }}
        run: |
          set +e
          source scripts/ci/veloflux_process.sh
          stop_veloflux_from_pidfile tmp/perf_daily_ci/veloflux.pid
          if ! wait_for_port_release 8080 \
            || ! wait_for_port_release 6060; then
            report_port_release_failure
            exit 1
          fi

      - name: Start veloflux (for select *)
        if: ${{ env.DAILY_TASK == 'all' || env.DAILY_TASK == 'perf-daily' }}
        env:
          # Use the default jemalloc (enabled by default features) with perf-oriented runtime tuning.
          _RJEM_MALLOC_CONF: "background_thread:true,dirty_decay_ms:0,muzzy_decay_ms:0"
        run: |
          set -euo pipefail
          mkdir -p tmp/perf_daily_ci
          rm -f tmp/perf_daily_ci/veloflux.pid
          target/release/veloflux --config etc/config.example.yaml --data-dir tmp/perf_daily_ci/data > tmp/perf_daily_ci/veloflux.log 2>&1 &
          pid="$!"
          echo "$pid" > tmp/perf_daily_ci/veloflux.pid
          sleep 2
          if ! kill -0 "$pid" 2>/dev/null; then
            echo "veloflux exited shortly after restart" >&2
            tail -n 200 tmp/perf_daily_ci/veloflux.log >&2 || true
            exit 1
          fi

      - name: Run perf scenario (select *)
        if: ${{ env.DAILY_TASK == 'all' || env.DAILY_TASK == 'perf-daily' }}
        env:
          PERF_OUT_DIR: tmp/perf_daily_ci/out_star
          PERF_DURATION_SECS: "120"
        run: |
          set -euo pipefail
          PYTHONPYCACHEPREFIX=tmp/pycache \
          python3 tests/perf_daily/perf_daily.py \
            --force \
            --base-url http://127.0.0.1:8080 \
            --metrics-url http://127.0.0.1:8080/metrics \
            --broker-url tcp://127.0.0.1:1883 \
            --topic /perf/daily \
            --qos 1 \
            --columns 15000 \
            --sql-mode star \
            --pipeline-id perf_daily_pipeline_star \
            --cases 20 \
            --str-len 10 \
            --duration-secs "${PERF_DURATION_SECS}" \
            --rate 50 \
            --scrape-interval-ms 15000 \
            --out-dir "${PERF_OUT_DIR}" \
            run

      - name: Render perf report (select *)
        if: ${{ env.DAILY_TASK == 'all' || env.DAILY_TASK == 'perf-daily' }}
        env:
          PERF_OUT_DIR: tmp/perf_daily_ci/out_star
        run: |
          set -euo pipefail
          PYTHONPYCACHEPREFIX=tmp/pycache \
          python3 tests/perf_daily/perf_daily_report.py \
            --result-json "${PERF_OUT_DIR}/result.json" \
            --out-html "${PERF_OUT_DIR}/report.html" \
            --summary-path "${GITHUB_STEP_SUMMARY}" \
            --title "Perf Daily Wide MQTT - select * (2m) (${{ github.sha }})"

      - name: Upload perf artifacts
        if: ${{ always() && (env.DAILY_TASK == 'all' || env.DAILY_TASK == 'perf-daily') }}
        uses: actions/upload-artifact@v4
        with:
          name: perf-daily-wide-mqtt-${{ github.run_id }}
          if-no-files-found: ignore
          path: |
            tmp/perf_daily_ci/out_explicit/result.json
            tmp/perf_daily_ci/out_explicit/metrics.openmetrics
            tmp/perf_daily_ci/out_explicit/report.html
            tmp/perf_daily_ci/out_star/result.json
            tmp/perf_daily_ci/out_star/metrics.openmetrics
            tmp/perf_daily_ci/out_star/report.html
            tmp/perf_daily_ci/veloflux.log

      - name: Stop veloflux
        if: ${{ always() && (env.DAILY_TASK == 'all' || env.DAILY_TASK == 'perf-daily') }}
        run: |
          set +e
          source scripts/ci/veloflux_process.sh
          stop_veloflux_from_pidfile tmp/perf_daily_ci/veloflux.pid

  sanitizers:
    name: Sanitizer Audit (${{ matrix.sanitizer }})
    runs-on: ubuntu-latest
    env:
      DAILY_TASK: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.task || 'all' }}
    # schedule: always run; workflow_dispatch: run if "all" or "sanitizers" selected.
    if: ${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && (github.event.inputs.task == 'all' || github.event.inputs.task == 'sanitizers')) }}
    strategy:
      fail-fast: false
      matrix:
        sanitizer: [asan, tsan, stack]
    services:
      emqx:
        image: emqx/emqx:5.6.1
        ports:
          - 1883:1883
        env:
          EMQX_ALLOW_ANONYMOUS: "true"
          EMQX_LISTENER__TCP__DEFAULT__BIND: "0.0.0.0:1883"
    steps:
      - name: Maximize build space
        uses: easimon/maximize-build-space@v10
        with:
          root-reserve-mb: 6144
          swap-size-mb: 8192
          temp-reserve-mb: 1024
          remove-dotnet: 'true'
          remove-android: 'true'
          remove-haskell: 'true'
          remove-codeql: 'true'
          remove-docker-images: 'true'

      - uses: actions/checkout@v4

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@nightly
        with:
          toolchain: ${{ matrix.sanitizer == 'stack' && 'stable' || 'nightly-2026-04-29' }}
          components: rust-src

      - name: Install system dependencies
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lld protobuf-compiler

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ runner.os }}-sanitizer-${{ matrix.sanitizer }}-${{ hashFiles('**/Cargo.toml') }}

      - name: Run Audit
        run: |
          if [ "${{ matrix.sanitizer }}" = "asan" ]; then
            make test-asan TARGET=x86_64-unknown-linux-gnu CARGO="cargo +nightly-2026-04-29"
          elif [ "${{ matrix.sanitizer }}" = "tsan" ]; then
            make test-tsan TARGET=x86_64-unknown-linux-gnu CARGO="cargo +nightly-2026-04-29"
          elif [ "${{ matrix.sanitizer }}" = "stack" ]; then
            make test-stack CARGO="cargo +stable"
          fi
