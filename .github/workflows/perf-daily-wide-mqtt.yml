name: Perf Daily Wide MQTT

on:
  workflow_dispatch:
    inputs:
      target_ref:
        description: 'Branch or commit to benchmark (default: main)'
        required: true
        default: 'main'
        type: string
      columns:
        description: 'Column count (default: 15000)'
        required: true
        default: '15000'
        type: string
      duration_secs:
        description: 'Duration per scenario in seconds (default: 120)'
        required: true
        default: '120'
        type: string
      interval_ms:
        description: 'Message interval in milliseconds (default: 20)'
        required: true
        default: '20'
        type: string
      pipelines:
        description: 'Number of pipelines sharing the MQTT stream (default: 1)'
        required: true
        default: '1'
        type: string

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  perf-daily:
    name: Wide MQTT Perf
    runs-on: ubuntu-latest
    services:
      emqx:
        image: emqx/emqx:5.6.1
        ports:
          - 1883:1883
        env:
          EMQX_ALLOW_ANONYMOUS: "true"
          EMQX_LISTENER__TCP__DEFAULT__BIND: "0.0.0.0:1883"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.target_ref }}

      - name: Install system dependencies
        run: sudo apt-get update -qq && sudo apt-get install -y -qq protobuf-compiler

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Build veloflux (release, jemalloc)
        run: |
          set -euo pipefail
          CARGO_TARGET_DIR=target-jemalloc cargo build --release

      - name: Build veloflux (release, system allocator)
        run: |
          set -euo pipefail
          CARGO_TARGET_DIR=target-system cargo build --release --no-default-features --features "metrics,profiling,allocator-system"

      - name: Start veloflux (jemalloc)
        env:
          _RJEM_MALLOC_CONF: "background_thread:true,dirty_decay_ms:0,muzzy_decay_ms:0"
        run: |
          set -euo pipefail
          mkdir -p tmp/perf_daily_ci/jemalloc
          target-jemalloc/release/veloflux --config etc/config.example.yaml --data-dir tmp/perf_daily_ci/jemalloc/data > tmp/perf_daily_ci/jemalloc/veloflux.log 2>&1 &
          echo $! > tmp/perf_daily_ci/jemalloc/veloflux.pid

      - name: Run perf scenario (jemalloc, explicit columns)
        env:
          PERF_OUT_DIR: tmp/perf_daily_ci/jemalloc/out_explicit
          PERF_COLUMNS: ${{ inputs.columns || '15000' }}
          PERF_DURATION_SECS: ${{ inputs.duration_secs || '120' }}
          PERF_INTERVAL_MS: ${{ inputs.interval_ms || '20' }}
          PERF_PIPELINES: ${{ inputs.pipelines || '1' }}
        run: |
          set -euo pipefail
          if [ "$PERF_INTERVAL_MS" -le 0 ] || [ "$((1000 % PERF_INTERVAL_MS))" -ne 0 ]; then
            echo "interval_ms must be positive and divide 1000 exactly." >&2
            exit 1
          fi
          PERF_RATE=$((1000 / PERF_INTERVAL_MS))
          PYTHONPYCACHEPREFIX=tmp/pycache \
          python3 tests/perf_daily/perf_daily.py \
            --force \
            --base-url http://127.0.0.1:8080 \
            --metrics-url http://127.0.0.1:8080/metrics \
            --broker-url tcp://127.0.0.1:1883 \
            --topic /perf/daily \
            --qos 1 \
            --columns "${PERF_COLUMNS}" \
            --sql-mode explicit \
            --pipeline-id perf_daily_pipeline_explicit \
            --pipelines "${PERF_PIPELINES}" \
            --cases 20 \
            --str-len 10 \
            --duration-secs "${PERF_DURATION_SECS}" \
            --rate "${PERF_RATE}" \
            --scrape-interval-ms 15000 \
            --out-dir "${PERF_OUT_DIR}" \
            run

      - name: Render report (jemalloc, explicit columns)
        env:
          PERF_OUT_DIR: tmp/perf_daily_ci/jemalloc/out_explicit
        run: |
          set -euo pipefail
          PYTHONPYCACHEPREFIX=tmp/pycache \
          python3 tests/perf_daily/perf_daily_report.py \
            --result-json "${PERF_OUT_DIR}/result.json" \
            --out-html "${PERF_OUT_DIR}/report.html" \
            --summary-path "${GITHUB_STEP_SUMMARY}" \
            --title "Perf Daily Wide MQTT (jemalloc) - explicit (${{ inputs.columns || '15000' }} cols, ${{ inputs.interval_ms || '20' }}ms, ${{ inputs.pipelines || '1' }} pipelines, ${{ inputs.duration_secs || '120' }}s) (${{ github.sha }})"

      - name: Stop veloflux (jemalloc, after explicit)
        if: always()
        run: |
          set +e
          if [ -f tmp/perf_daily_ci/jemalloc/veloflux.pid ]; then
            kill "$(cat tmp/perf_daily_ci/jemalloc/veloflux.pid)" 2>/dev/null || true
          fi

      - name: Start veloflux (jemalloc, for select *)
        env:
          _RJEM_MALLOC_CONF: "background_thread:true,dirty_decay_ms:0,muzzy_decay_ms:0"
        run: |
          set -euo pipefail
          mkdir -p tmp/perf_daily_ci/jemalloc
          target-jemalloc/release/veloflux --config etc/config.example.yaml --data-dir tmp/perf_daily_ci/jemalloc/data > tmp/perf_daily_ci/jemalloc/veloflux.log 2>&1 &
          echo $! > tmp/perf_daily_ci/jemalloc/veloflux.pid

      - name: Run perf scenario (jemalloc, select *)
        env:
          PERF_OUT_DIR: tmp/perf_daily_ci/jemalloc/out_star
          PERF_COLUMNS: ${{ inputs.columns || '15000' }}
          PERF_DURATION_SECS: ${{ inputs.duration_secs || '120' }}
          PERF_INTERVAL_MS: ${{ inputs.interval_ms || '20' }}
          PERF_PIPELINES: ${{ inputs.pipelines || '1' }}
        run: |
          set -euo pipefail
          if [ "$PERF_INTERVAL_MS" -le 0 ] || [ "$((1000 % PERF_INTERVAL_MS))" -ne 0 ]; then
            echo "interval_ms must be positive and divide 1000 exactly." >&2
            exit 1
          fi
          PERF_RATE=$((1000 / PERF_INTERVAL_MS))
          PYTHONPYCACHEPREFIX=tmp/pycache \
          python3 tests/perf_daily/perf_daily.py \
            --force \
            --base-url http://127.0.0.1:8080 \
            --metrics-url http://127.0.0.1:8080/metrics \
            --broker-url tcp://127.0.0.1:1883 \
            --topic /perf/daily \
            --qos 1 \
            --columns "${PERF_COLUMNS}" \
            --sql-mode star \
            --pipeline-id perf_daily_pipeline_star \
            --pipelines "${PERF_PIPELINES}" \
            --cases 20 \
            --str-len 10 \
            --duration-secs "${PERF_DURATION_SECS}" \
            --rate "${PERF_RATE}" \
            --scrape-interval-ms 15000 \
            --out-dir "${PERF_OUT_DIR}" \
            run

      - name: Render report (jemalloc, select *)
        env:
          PERF_OUT_DIR: tmp/perf_daily_ci/jemalloc/out_star
        run: |
          set -euo pipefail
          PYTHONPYCACHEPREFIX=tmp/pycache \
          python3 tests/perf_daily/perf_daily_report.py \
            --result-json "${PERF_OUT_DIR}/result.json" \
            --out-html "${PERF_OUT_DIR}/report.html" \
            --summary-path "${GITHUB_STEP_SUMMARY}" \
            --title "Perf Daily Wide MQTT (jemalloc) - select * (${{ inputs.columns || '15000' }} cols, ${{ inputs.interval_ms || '20' }}ms, ${{ inputs.pipelines || '1' }} pipelines, ${{ inputs.duration_secs || '120' }}s) (${{ github.sha }})"

      - name: Stop veloflux (jemalloc)
        if: always()
        run: |
          set +e
          if [ -f tmp/perf_daily_ci/jemalloc/veloflux.pid ]; then
            kill "$(cat tmp/perf_daily_ci/jemalloc/veloflux.pid)" 2>/dev/null || true
          fi

      - name: Start veloflux (system allocator)
        run: |
          set -euo pipefail
          mkdir -p tmp/perf_daily_ci/system
          target-system/release/veloflux --config etc/config.example.yaml --data-dir tmp/perf_daily_ci/system/data > tmp/perf_daily_ci/system/veloflux.log 2>&1 &
          echo $! > tmp/perf_daily_ci/system/veloflux.pid

