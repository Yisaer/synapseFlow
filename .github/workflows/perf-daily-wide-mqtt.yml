          PYTHONPYCACHEPREFIX=tmp/pycache \
          python3 tests/perf_daily/perf_daily.py \
            --force \
            --base-url http://127.0.0.1:8080 \
            --metrics-url http://127.0.0.1:8080/metrics \
            --broker-url tcp://127.0.0.1:1883 \
            --topic /perf/daily \
            --qos 1 \
            --columns "${PERF_COLUMNS}" \
            --sql-mode explicit \
            --pipeline-id perf_daily_pipeline_explicit \
            --pipelines "${PERF_PIPELINES}" \
            --cases 20 \
            --str-len 10 \
            --duration-secs "${PERF_DURATION_SECS}" \
            --rate "${PERF_RATE}" \
            --scrape-interval-ms 15000 \
            --out-dir "${PERF_OUT_DIR}" \
            run

      - name: Render report (system, explicit columns)
        env:
          PERF_OUT_DIR: tmp/perf_daily_ci/system/out_explicit
        run: |
          set -euo pipefail
          PYTHONPYCACHEPREFIX=tmp/pycache \
          python3 tests/perf_daily/perf_daily_report.py \
            --result-json "${PERF_OUT_DIR}/result.json" \
            --out-html "${PERF_OUT_DIR}/report.html" \
            --summary-path "${GITHUB_STEP_SUMMARY}" \
            --title "Perf Daily Wide MQTT (system) - explicit (${{ inputs.columns || '15000' }} cols, ${{ inputs.interval_ms || '20' }}ms, ${{ inputs.pipelines || '1' }} pipelines, ${{ inputs.duration_secs || '120' }}s) (${{ github.sha }})"

      - name: Stop veloflux (system, after explicit)
        if: always()
        run: |
          set +e
          if [ -f tmp/perf_daily_ci/system/veloflux.pid ]; then
            kill "$(cat tmp/perf_daily_ci/system/veloflux.pid)" 2>/dev/null || true
          fi

      - name: Start veloflux (system, for select *)
        run: |
          set -euo pipefail
          mkdir -p tmp/perf_daily_ci/system
          target-system/release/veloflux --config etc/config.example.yaml --data-dir tmp/perf_daily_ci/system/data > tmp/perf_daily_ci/system/veloflux.log 2>&1 &
          echo $! > tmp/perf_daily_ci/system/veloflux.pid

      - name: Run perf scenario (system, select *)
