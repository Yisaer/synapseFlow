            --metrics-url http://127.0.0.1:8080/metrics \
            --broker-url tcp://127.0.0.1:1883 \
            --topic /perf/daily \
            --qos 1 \
            --columns "${PERF_COLUMNS}" \
            --sql-mode star \
            --pipeline-id perf_daily_pipeline_star \
