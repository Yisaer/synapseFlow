      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: perf-daily-wide-mqtt-${{ github.run_id }}
          if-no-files-found: ignore
          path: |
            tmp/perf_daily_ci/jemalloc/out_explicit/result.json
            tmp/perf_daily_ci/jemalloc/out_explicit/metrics.openmetrics
            tmp/perf_daily_ci/jemalloc/out_explicit/report.html
            tmp/perf_daily_ci/jemalloc/out_star/result.json
            tmp/perf_daily_ci/jemalloc/out_star/metrics.openmetrics
            tmp/perf_daily_ci/jemalloc/out_star/report.html
            tmp/perf_daily_ci/jemalloc/veloflux.log
            tmp/perf_daily_ci/system/out_explicit/result.json
            tmp/perf_daily_ci/system/out_explicit/metrics.openmetrics
            tmp/perf_daily_ci/system/out_explicit/report.html
            tmp/perf_daily_ci/system/out_star/result.json
