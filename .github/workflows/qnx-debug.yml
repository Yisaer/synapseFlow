name: QNX Debug Build

on:
  pull_request:
    types: [opened, reopened, synchronize]
  workflow_dispatch:
    inputs:
      qnx_target:
        description: QNX Rust target to build
        required: true
        default: x86_64-pc-nto-qnx800
        type: choice
        options:
          - x86_64-pc-nto-qnx800
          - aarch64-unknown-nto-qnx800
      qnx_baseline:
        description: QNX SDP baseline package
        required: true
        default: com.qnx.qnx800
        type: string
      qnx_mirror_baseline:
        description: QNX SDP mirror baseline id
        required: true
        default: qnx800
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.run_id }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_BUILD_JOBS: 2
  CARGO_HOME: /home/runner/.cargo
  CARGO_INCREMENTAL: 0
  QNX_INSTALL_DIR: /home/runner/qnx800
  QNX_QSC_DIR: /home/runner/qnxsoftwarecenter
  QNX_RUST_TOOLCHAIN: qnx
  QNX_DEFAULT_BASELINE: com.qnx.qnx800
  QNX_DEFAULT_MIRROR_BASELINE: qnx800
  QNX_DEFAULT_TARGET: x86_64-pc-nto-qnx800

jobs:
  qnx-debug-build:
    name: QNX debug build (${{ inputs.qnx_target || 'x86_64-pc-nto-qnx800' }})
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install host dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            ca-certificates \
            curl \
            file \
            m4 \
            protobuf-compiler \
            unzip

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: qnx-cargo-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            qnx-cargo-${{ runner.os }}-

      - name: Install QNX Software Center
        env:
          GH_TOKEN: ${{ secrets.QNX_INSTALLER_TOKEN }}
        run: |
          set -euo pipefail

          installer="$RUNNER_TEMP/qnx-setup-linux.run"
          gh release download qnx-sdp-8-installer \
            --repo Yisaer/qnx-private-assets \
            --pattern qnx-setup-2.0.4-202501021438-linux.run \
            --dir "$RUNNER_TEMP"
          mv "$RUNNER_TEMP/qnx-setup-2.0.4-202501021438-linux.run" "$installer"
          echo "5695a0ec8a1fd91840753b2cba86a9325f6052d4f69c757166cc61b09bcbe507  $installer" | sha256sum --check
          if file "$installer" | grep -qiE 'html|text'; then
            echo "Downloaded QNX Software Center installer does not look executable." >&2
            echo "Check the qnx-private-assets release asset." >&2
            file "$installer" >&2
            exit 1
          fi
          chmod +x "$installer"

          "$installer" force-override disable-auto-start agree-to-license-terms "$QNX_QSC_DIR"

          qsc_bin="$QNX_QSC_DIR/qnxsoftwarecenter/qnxsoftwarecenter_clt"
          if [ ! -x "$qsc_bin" ]; then
            qsc_bin="$(find "$QNX_QSC_DIR" -type f -name qnxsoftwarecenter_clt -perm -111 | head -n 1)"
          fi
          if [ -z "$qsc_bin" ] || [ ! -x "$qsc_bin" ]; then
            echo "qnxsoftwarecenter_clt was not found under $QNX_QSC_DIR" >&2
            find "$QNX_QSC_DIR" -maxdepth 4 -type f | sort >&2
            exit 1
          fi

          qsc_dir="$(dirname "$qsc_bin")"
          echo "$qsc_dir" >> "$GITHUB_PATH"
          echo "QNX_QSC_BIN=$qsc_bin" >> "$GITHUB_ENV"

      - name: Install QNX SDP
        env:
          QNX_SERIAL_NUMBER: ${{ secrets.QNX_SERIAL_NUMBER }}
          QNX_LICENSE_KEY: ${{ secrets.QNX_LICENSE_KEY }}
          QNX_BASELINE: ${{ inputs.qnx_baseline || 'com.qnx.qnx800' }}
          QNX_MIRROR_BASELINE: ${{ inputs.qnx_mirror_baseline || 'qnx800' }}
          QNX_MYQNX_USER: ${{ secrets.QNX_MYQNX_USER }}
          QNX_MYQNX_PASSWORD: ${{ secrets.QNX_MYQNX_PASSWORD }}
        run: |
          set -euo pipefail

          "$QNX_QSC_BIN" \
            -addLicenseKey "$QNX_LICENSE_KEY" \
            -listLicenseKeys

          if [ -z "$QNX_MYQNX_USER" ] || [ -z "$QNX_MYQNX_PASSWORD" ]; then
            echo "QNX_MYQNX_USER and QNX_MYQNX_PASSWORD secrets are required to mirror QNX SDP packages." >&2
            exit 1
          fi

          "$QNX_QSC_BIN" \
            -mirrorBaseline "$QNX_MIRROR_BASELINE" \
            -myqnx.user "$QNX_MYQNX_USER" \
            -myqnx.password "$QNX_MYQNX_PASSWORD"

          "$QNX_QSC_BIN" \
            -cleanInstall \
            -destination "$QNX_INSTALL_DIR" \
            -installBaseline "$QNX_BASELINE" \
            -listLicenseKeys \
            -myqnx.user "$QNX_MYQNX_USER" \
            -myqnx.password "$QNX_MYQNX_PASSWORD"

      - name: Locate QNX environment
        run: |
          set -euo pipefail

          env_script="$(find "$QNX_INSTALL_DIR" -type f -name qnxsdp-env.sh | head -n 1)"
          if [ -z "$env_script" ]; then
            echo "qnxsdp-env.sh was not found under $QNX_INSTALL_DIR" >&2
            find "$QNX_INSTALL_DIR" -maxdepth 4 -type f | sort >&2
            exit 1
          fi

          echo "QNX_ENV_SCRIPT=$env_script" >> "$GITHUB_ENV"

      - name: Link QNX Rust toolchain
        run: |
          set -euo pipefail
          # shellcheck disable=SC1090
          source "$QNX_ENV_SCRIPT"

          rust_root=""
          while IFS= read -r rustc_path; do
            candidate="$(dirname "$(dirname "$rustc_path")")"
            if [ -x "$candidate/bin/rustc" ] && [ -d "$candidate/lib/rustlib" ]; then
              rust_root="$candidate"
              break
            fi
          done < <(find "$QNX_HOST" "$QNX_INSTALL_DIR" -type f -name rustc -perm -111 | sort)

          if [ -z "$rust_root" ]; then
            echo "QNX Rust toolchain was not found under $QNX_HOST or $QNX_INSTALL_DIR" >&2
            find "$QNX_HOST" "$QNX_INSTALL_DIR" -type f \( -name rustc -o -name cargo \) | sort >&2
            exit 1
          fi

          rustup toolchain link "$QNX_RUST_TOOLCHAIN" "$rust_root"

          cargo +"$QNX_RUST_TOOLCHAIN" -V
          rustc +"$QNX_RUST_TOOLCHAIN" -Vv

      - name: Build veloFlux debug binary for QNX
        env:
          QNX_TARGET: ${{ inputs.qnx_target || 'x86_64-pc-nto-qnx800' }}
        run: |
          set -euo pipefail
          # shellcheck disable=SC1090
          source "$QNX_ENV_SCRIPT"

          make debug CARGO="cargo +$QNX_RUST_TOOLCHAIN --target $QNX_TARGET"

      - name: Inspect QNX binary
        env:
          QNX_TARGET: ${{ inputs.qnx_target || 'x86_64-pc-nto-qnx800' }}
        run: |
          set -euo pipefail

          bin="target/$QNX_TARGET/debug/veloflux"
          test -x "$bin"
          file "$bin"

      - name: Upload QNX debug binary
        uses: actions/upload-artifact@v4
        with:
          name: veloflux-qnx-${{ inputs.qnx_target || 'x86_64-pc-nto-qnx800' }}-debug
          path: target/${{ inputs.qnx_target || 'x86_64-pc-nto-qnx800' }}/debug/veloflux
          if-no-files-found: error
