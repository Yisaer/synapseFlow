name: QNX Debug Build

on:
  pull_request:
    types: [opened, reopened, synchronize]
  workflow_dispatch:
    inputs:
      qnx_target:
        description: QNX Rust target to build
        required: true
        default: aarch64-unknown-nto-qnx800
        type: choice
        options:
          - aarch64-unknown-nto-qnx800
          - x86_64-pc-nto-qnx800

concurrency:
  group: ${{ github.workflow }}-${{ github.run_id }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_BUILD_JOBS: 2
  CARGO_HOME: /root/.cargo
  CARGO_INCREMENTAL: 0
  CARGO_NET_GIT_FETCH_WITH_CLI: true
  QNX_INSTALL_DIR: /opt/qnx800
  QNX_RUST_TOOLCHAIN: qnx
  QNX_SDP_IMAGE: ghcr.io/emqx/veloflux-qnx-sdp:8.0-try

jobs:
  qnx-debug-build:
    name: QNX debug build (${{ inputs.qnx_target || 'aarch64-unknown-nto-qnx800' }}, ${{ matrix.patch_label }})
    runs-on: infra-emqx-io-4c
    timeout-minutes: 120
    permissions:
      contents: read
      packages: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - patch_scheme: skarlsson
            patch_label: skarlsson-upstream-prs
          - patch_scheme: qnx-ports
            patch_label: qnx-ports-bundle
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare QNX dependency patch
        env:
          QNX_PATCH_SCHEME: ${{ matrix.patch_scheme }}
        run: |
          set -euo pipefail

          tmp="$(mktemp)"
          awk '
            /^\[patch\.crates-io\]$/ { skip = 1; next }
            skip && /^\[/ { skip = 0 }
            !skip { print }
          ' Cargo.toml > "$tmp"
          mv "$tmp" Cargo.toml

          case "$QNX_PATCH_SCHEME" in
            skarlsson)
              {
                echo
                echo "[patch.crates-io]"
                echo "# Temporary QNX 8.0 workaround until upstream libc/tokio publish"
                echo "# nto80 io-sock fixes."
                echo 'libc = { git = "https://github.com/skarlsson/libc.git", rev = "e464a33781da9cb6ffa09b7ec1d6f4a872177e34" }'
                echo 'tokio = { git = "https://github.com/skarlsson/tokio.git", rev = "f6954942b83378942f521979bfb8e5199dd09118" }'
              } >> Cargo.toml
              ;;
            qnx-ports)
              {
                echo
                echo "[patch.crates-io]"
                echo "# Temporary QNX 8.0 workaround using the QNX ports Tokio bundle."
                echo 'libc = { git = "https://github.com/qnx-ports/libc-rs.git", rev = "9c10cca9e5fb3a4e3dc6c4e88029343fb7111f90" }'
                echo 'socket2 = { git = "https://github.com/qnx-ports/socket2-rs.git", rev = "ca2d6b04c87ababeaee209fe7fa31796fd48808a" }'
                echo 'tokio = { git = "https://github.com/qnx-ports/tokio.git", rev = "c5e4a5e2e770121a7ff2d52d40d4aa9dfb3b0722" }'
              } >> Cargo.toml
              ;;
            *)
              echo "Unknown QNX patch scheme: $QNX_PATCH_SCHEME" >&2
              exit 1
              ;;
          esac

          echo "Using QNX patch scheme: $QNX_PATCH_SCHEME"
          sed -n '/^\[patch\.crates-io\]/,$p' Cargo.toml | head -20

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Pull QNX SDP image
        run: docker pull "$QNX_SDP_IMAGE"

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            .cargo-cache/registry
            .cargo-cache/git
          key: qnx-${{ matrix.patch_scheme }}-cargo-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            qnx-${{ matrix.patch_scheme }}-cargo-${{ runner.os }}-

      - name: Build veloFlux debug binary for QNX
        env:
          RUST_TARGET: ${{ inputs.qnx_target || 'aarch64-unknown-nto-qnx800' }}
          CARGO_BUILD_TARGET: ${{ inputs.qnx_target || 'aarch64-unknown-nto-qnx800' }}
          QNX_PATCH_SCHEME: ${{ matrix.patch_scheme }}
        run: |
          set -euo pipefail

          mkdir -p "$PWD/.cargo-cache/registry" "$PWD/.cargo-cache/git"

          docker run --rm \
            -v "$PWD:/workspace" \
            -w /workspace \
            -e CARGO_TERM_COLOR \
            -e CARGO_BUILD_JOBS \
            -e CARGO_INCREMENTAL \
            -e CARGO_NET_GIT_FETCH_WITH_CLI \
            -e CARGO_HOME=/workspace/.cargo-cache \
            -e QNX_INSTALL_DIR \
            -e QNX_RUST_TOOLCHAIN \
            -e RUST_TARGET \
            -e CARGO_BUILD_TARGET \
            -e QNX_PATCH_SCHEME \
            "$QNX_SDP_IMAGE" \
            bash -lc '
              set -euo pipefail

              apt-get update
              apt-get install -y --no-install-recommends \
                build-essential \
                curl \
                git \
                m4 \
                pkg-config \
                protobuf-compiler

              curl --proto "=https" --tlsv1.2 -sSf https://sh.rustup.rs \
                | sh -s -- -y --default-toolchain stable
              source "$CARGO_HOME/env"

              QNX_RUST_TC_URL="https://github.com/qorix-group/rust-lang-qnx8/releases/download/1.2.0/qnx8_rust_toolchain.tar.gz"
              QNX_RUST_TC_DIR="/opt/qnx-rust-toolchain"

              echo "Downloading QNX Rust toolchain from qorix-group/rust-lang-qnx8..."
              curl -fsSL "$QNX_RUST_TC_URL" -o /tmp/qnx8_rust_toolchain.tar.gz
              mkdir -p "$QNX_RUST_TC_DIR"
              tar -xzf /tmp/qnx8_rust_toolchain.tar.gz -C "$QNX_RUST_TC_DIR" --strip-components=1
              rm -f /tmp/qnx8_rust_toolchain.tar.gz

              if [ ! -x "$QNX_RUST_TC_DIR/bin/rustc" ]; then
                inner="$(find "$QNX_RUST_TC_DIR" -maxdepth 3 -type f -name rustc -perm -111 | head -1)"
                if [ -n "$inner" ]; then
                  QNX_RUST_TC_DIR="$(dirname "$(dirname "$inner")")"
                  echo "Adjusted toolchain root to: $QNX_RUST_TC_DIR"
                else
                  echo "QNX Rust toolchain: rustc not found after extraction" >&2
                  find "$QNX_RUST_TC_DIR" -maxdepth 4 -type f | sort >&2
                  exit 1
                fi
              fi

              rustup toolchain link "$QNX_RUST_TOOLCHAIN" "$QNX_RUST_TC_DIR"
              cargo +"$QNX_RUST_TOOLCHAIN" -V
              rustc +"$QNX_RUST_TOOLCHAIN" -Vv

              case "$QNX_PATCH_SCHEME" in
                skarlsson)
                  cargo +"$QNX_RUST_TOOLCHAIN" update -p tokio --precise 1.52.1
                  ;;
                qnx-ports)
                  cargo +"$QNX_RUST_TOOLCHAIN" update -p tokio --precise 1.50.0
                  cargo +"$QNX_RUST_TOOLCHAIN" update -p socket2@0.6.4 --precise 0.6.3
                  ;;
                *)
                  echo "Unknown QNX patch scheme: $QNX_PATCH_SCHEME" >&2
                  exit 1
                  ;;
              esac

              echo "Resolved QNX dependency patches:"
              cargo +"$QNX_RUST_TOOLCHAIN" tree -i tokio --target "$RUST_TARGET"
              cargo +"$QNX_RUST_TOOLCHAIN" tree -i socket2 --target "$RUST_TARGET" || true
              cargo +"$QNX_RUST_TOOLCHAIN" tree -i libc --target "$RUST_TARGET" || true

              echo "=== QNX toolchain diagnostics ==="
              SYSROOT="$(rustc +"$QNX_RUST_TOOLCHAIN" --print sysroot)"
              echo "Sysroot: $SYSROOT"
              echo "Installed targets (with pre-built std):"
              ls -1 "$SYSROOT/lib/rustlib/" 2>/dev/null || true
              echo "Known QNX targets:"
              rustc +"$QNX_RUST_TOOLCHAIN" --print target-list 2>/dev/null | grep -i qnx || true

              source "$QNX_INSTALL_DIR/qnxsdp-env.sh"
              echo "QNX TCP keepalive macros:"
              grep -RnsE "#[[:space:]]*define[[:space:]]+TCP_KEEP(ALIVE|IDLE|INTVL|CNT)\\b" \
                "$QNX_TARGET/usr/include" | head -20 || true
              echo "Target cfg:"
              rustc +"$QNX_RUST_TOOLCHAIN" --print cfg --target "$RUST_TARGET" | sort

              make debug CARGO="cargo +$QNX_RUST_TOOLCHAIN"
            '

      - name: Inspect QNX binary
        env:
          QNX_TARGET: ${{ inputs.qnx_target || 'aarch64-unknown-nto-qnx800' }}
        run: |
          set -euo pipefail

          bin="target/$QNX_TARGET/debug/veloflux"
          test -x "$bin"
          file "$bin"

      - name: Upload QNX debug binary
        uses: actions/upload-artifact@v4
        with:
          name: veloflux-qnx-${{ matrix.patch_label }}-${{ inputs.qnx_target || 'aarch64-unknown-nto-qnx800' }}-debug
          path: target/${{ inputs.qnx_target || 'aarch64-unknown-nto-qnx800' }}/debug/veloflux
          if-no-files-found: error
